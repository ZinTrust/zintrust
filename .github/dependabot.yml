# Dependabot Configuration
# Automated dependency updates for security and versioning

version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    labels:
      - 'dependencies'
    groups:
      opentelemetry:
        patterns:
          - '@opentelemetry/*'
    ignore:
      - dependency-name: '@opentelemetry/api'
        versions: ['>=1.10.0']

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
