name: Release Verification

on:
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HUSKY: 0

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PR_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: '20.x'

      - name: Sync workspace versions for publish
        run: |
          node scripts/release/sync-package-versions.mjs
          npm install --package-lock-only --ignore-scripts

      - name: Install dependencies
        run: sh scripts/ci/install-deps.sh

      - name: Run tests, lint and type-check
        run: npm run test:coverage && npm run lint:strict && npm run type-check

      - name: Build distribution (core only)
        run: npm run core:build:dist

      - name: Smoke gate (fresh scaffold + cold start)
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$PWD"
          WORKDIR="$RUNNER_TEMP/zintrust-smoke"
          rm -rf "$WORKDIR"
          mkdir -p "$WORKDIR"
          cd "$WORKDIR"

          # Scaffold a brand-new app without prompts/installs.
          node "$ROOT/dist/bin/zin.js" new smoke-app \
            --template basic \
            --database sqlite \
            --port 7777 \
            --no-interactive \
            --no-install \
            --no-git \
            --force

          cd "$WORKDIR/smoke-app"

          # Install the locally built framework package (dist/) into the fresh app.
          npm install --no-audit --no-fund "$ROOT/dist" || \
            npm install --no-audit --no-fund --legacy-peer-deps "$ROOT/dist"

          # Install only runtime deps. Governance/dev tooling is validated in-repo.
          npm install --omit=dev --no-audit --no-fund || npm install --omit=dev --no-audit --no-fund --legacy-peer-deps

          export PORT=7777
          export NODE_ENV=development
          export DB_CONNECTION=sqlite
          export WORKER_ENABLED=false
          export WORKER_AUTO_START=false
          export QUEUE_DRIVER=sync

          node ./node_modules/@zintrust/core/bin/zin.js start --no-watch > server.log 2>&1 &
          PID=$!

          cleanup() {
            kill "$PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          for i in {1..60}; do
            if curl -fsS "http://127.0.0.1:7777/health" >/dev/null; then
              echo "Smoke OK"
              exit 0
            fi
            sleep 0.25
          done

          echo "Smoke FAILED: /health never became ready"
          echo "---- server.log (tail) ----"
          tail -n 200 server.log || true
          exit 1

      - name: Verify version bump metadata
        id: version_check
        run: node scripts/ci/check-version.js

      - name: Summarize release verification
        run: |
          echo "Release verification completed. Publish the verified core dist and workspace packages with npm run pub:ci and npm run release:publish-packages."
