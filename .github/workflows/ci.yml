# GitHub Actions CI Workflow
# Fast feedback loop: Runs tests, linting, and type checking on push

name: CI/CD Pipeline

on:
  push:
    branches: [master, dev, release]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-checks:
    name: Quality Assurance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Validate workspace version sync
        run: node scripts/release/sync-package-versions.mjs --check

      - name: Install dependencies (disable lifecycle scripts in CI)
        run: npm ci --ignore-scripts
        env:
          HUSKY: 0
          NPM_CONFIG_IGNORE_SCRIPTS: true

      - name: Build native dependencies
        run: npm rebuild bcrypt better-sqlite3
        env:
          HUSKY: 0

      - name: Build core only
        run: npm run core:build:dist

      - name: Validate dist package file constraints
        run: node scripts/ci/check-dist-package-files.mjs

      - name: Enforce patch coverage gate
        run: npm run -s coverage:patch

      - name: Type checking
        run: npm run type-check

      - name: Lint code
        run: npm run lint --max-warnings=0

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage reports to Codecov
        if: matrix.node-version == '20.x'
        uses: codecov/codecov-action@671740ac38dd9b0130fbe1cec585b89eea48d3de # v5.5.2
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/coverage-final.json
          flags: unittests
          name: codecov-umbrella
